<!DOCTYPE html>

<html>

<head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <link rel="stylesheet" href="style.css">
    <script src='users.js'></script>
    <title>Пользователи</title>
</head>

<body>
    <div class="content">
        <aside class="page-sidebar">

            <p class="sidebar-greeting">Добрый день, <span class="username">username</span>!<br>
                Ваш уровень доступа: <span class="userlevel">0</span><br>
                <a class="logout" href="/logout.html">Выйти</a>
            </p>

            <ul class="nav-menu">
                <li><a href="data.html">Секретные данные</a></li>
                <li><a href="users.html" class="current-link">Пользователи</a></li>
            </ul>
        </aside>
        <main>
            <h1>Пользователи</h1>
            <article>

                <div class="info">
                    <form action="#add_user" id="add_user" method="post">
                        <span class="info-name">Создать пользователя </span>
                        <input type="text" name="arg1" maxlength="32" placeholder="имя пользователя"
                            required="required"><br>
                        <input type="text" name="arg3" maxlength="32" placeholder="пароль пользователя"
                            required="required">
                        <label class="info-name">Уровень доступа
                            <select name="arg2" required="required">
                                <option value="" disabled selected hidden>-</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </label>
                        <input type="hidden" name="app" value="../../build/s21_cli.app">
                        <input type="hidden" name="app_arg" value="w">
                        <input type="hidden" name="command" value="add_user">
                        <input type="submit" value="Создать">
                    </form>
                </div>

                <div class="info">
                    <form action="#upd_user" id="upd_user" method="post">
                        <span class="info-name">Изменить пользователя</span>
                        <input type="text" name="arg1" maxlength="32" placeholder="имя пользователя"
                            required="required"><br>
                        <input type="text" name="arg3" maxlength="32" placeholder="пароль пользователя"
                            required="required">
                        <label class="info-name">Уровень доступа
                            <select name="arg2" required="required">
                                <option value="" disabled selected hidden>-</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select>
                        </label>
                        <input type="hidden" name="app" value="../../build/s21_cli.app">
                        <input type="hidden" name="app_arg" value="w">
                        <input type="hidden" name="command" value="upd_user">
                        <input type="submit" value="Изменить">
                    </form>
                </div>

                <div class="info">
                    <form action="#del_user" id="del_user" method="post">
                        <span class="info-name">Удалить пользователя</span>
                        <input type="text" name="arg1" maxlength="32" placeholder="имя пользователя" name="arg1"
                            required="required"><br>
                        <input type="hidden" name="app" value="../../build/s21_cli.app">
                        <input type="hidden" name="app_arg" value="w">
                        <input type="hidden" name="command" value="del_user">
                        <input type="submit" value="Удалить">
                    </form>
                </div>

                <div class="info">
                    <form action="#sel_user" id="sel_user" method="post">
                        <span class="info-name">Показать всех пользователей</span><br><br>
                        <input type="hidden" name="app" value="../../build/s21_cli.app">
                        <input type="hidden" name="app_arg" value="w">
                        <input type="hidden" name="command" value="sel_user">
                        <input type="submit" value="Показать">
                    </form>
                </div>

                <pre id="data"></pre>

            </article>
        </main>
    </div>

</body>

</html>
